{% extends 'userhome.html' %}
{% load static %}

{% block content %}
<div class="form-card" style="max-width: 500px; margin-top: 0;">
    <h2 class="form-title"><i class="fa-solid fa-key text-danger me-2"></i> Change Password</h2>
    
    {% if output %}
    <div class="alert-premium alert-premium-info">
        <i class="fa-solid fa-circle-info"></i>
        <span>{{output}}</span>
    </div>
    {% endif %}

    <form method="POST" action="/user/cpuser/">
        {% csrf_token %}  
        
        <div class="form-group">
            <label for="opass">Old Password</label>
            <input type="password" class="form-control-premium" name="opass" id="opass" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <label for="npass">New Password</label>
            <input type="password" class="form-control-premium" name="npass" id="npass" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <label for="cnpass">Confirm New Password</label>
            <input type="password" class="form-control-premium" name="cnpass" id="cnpass" placeholder="••••••••" required>
        </div>  
        
        <div class="form-check mb-4">
            <input type="checkbox" id="confirm-chk" required>
            <label for="confirm-chk" class="m-0">I confirm password modification</label>
        </div>
        
        <button type="submit" class="btn-premium w-100 py-3">Update Password</button>
    </form>
</div>
{% endblock %}
