{% extends 'userhome.html' %}
{% load static %}

{% block content %}
<div class="form-card" style="max-width: 600px; margin-top: 0;">
    <h2 class="form-title"><i class="fa-solid fa-user-pen text-danger me-2"></i> Edit Profile</h2>
    
    {% if output %}
    <div class="alert-premium alert-premium-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>{{output}}</span>
    </div>
    {% endif %}

    <form method="POST" action="/user/epuser/">
        {% csrf_token %}  
        
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" class="form-control-premium" name="name" id="name" placeholder="Enter name" value="{{userDetails.name}}" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address (Read-only)</label>
            <input type="email" class="form-control-premium" name="email" id="email" value="{{userDetails.email}}" readonly>
            <small class="form-text text-muted mt-1 d-block">Your email address cannot be changed.</small>
        </div>
        
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" class="form-control-premium" name="mobile" id="mobile" value="{{userDetails.mobile}}" required>
        </div>
        
        <div class="form-group">
            <label for="address">Address</label>
            <textarea class="form-control-premium" name="address" id="address" rows="3" required>{{userDetails.address}}</textarea>
        </div>
        
        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="gender" value="Male" {{m}}>
                    <span>Male</span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="gender" value="Female" {{f}}>
                    <span>Female</span>
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="city">City</label>
            <select class="form-control-premium" name="city" id="city" required>
                <option value="{{userDetails.city}}">{{userDetails.city}} (Current)</option>
                <option value="Indore">Indore</option>
                <option value="Bhopal">Bhopal</option>
                <option value="Ujjain">Ujjain</option>
            </select>
        </div>
        
        <button type="submit" class="btn-premium w-100 py-3 mt-3">Update Profile</button>
    </form>
</div>  
{% endblock %}
